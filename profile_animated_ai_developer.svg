<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" preserveAspectRatio="xMidYMid slice">
  <title>Ashok Kumar S — animated header centered</title>

  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feBlend in="SourceGraphic" in2="b"/>
    </filter>

    <style>
      svg { font-family: "Segoe UI", Roboto, Arial, sans-serif; }
      .bg { fill: #050b18; }
      .blob { opacity:0.14; filter:url(#blur); }
      .textMain {
        fill: #ffffff;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -0.4px;
        text-anchor: middle;
      }
      .textSub {
        fill: #cfe3ff;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: -0.4px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1200" height="200" rx="10"/>

  <!-- Glow blobs -->
  <g class="blob">
    <ellipse cx="180" cy="40" rx="260" ry="110" fill="#16a34a"/>
    <ellipse cx="950" cy="150" rx="300" ry="140" fill="#0ea5e9"/>
    <ellipse cx="600" cy="20" rx="220" ry="90" fill="#a78bfa"/>
  </g>

  <!-- Centered container -->
  <g transform="translate(600,110)">
    <!-- Name text with SMIL animation -->
    <text class="textMain" x="0" y="0">
      Ashok Kumar S
      <animate attributeName="opacity" values="1;1;1;0;0;0;0;0;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,0;0,0;0,16;0,16;0,16;0,16;0,16;0,16;0,0" dur="6s" repeatCount="indefinite" additive="sum"/>
    </text>
    
    <!-- Role text with SMIL animation -->
    <text class="textSub" x="0" y="0">
      Backend Engineer &amp; AI Developer
      <animate attributeName="opacity" values="0;0;0;1;1;1;1;0;0" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0,-18;0,-18;0,0;0,0;0,0;0,0;0,-18;0,-18;0,-18" dur="6s" repeatCount="indefinite" additive="sum"/>
    </text>
  </g>

</svg>
